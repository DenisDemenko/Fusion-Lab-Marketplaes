name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fusionlab
          POSTGRES_PASSWORD: fusionlab
          POSTGRES_DB: fusionlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fusionlab:fusionlab@localhost:5432/fusionlab
      # apps/web/src/lib/firebase.ts викликає initializeApp() на рівні
      # модуля, тож `next build` імпортує його ще на кроці збирання
      # конфігурації сторінок і без ключа падає з auth/invalid-api-key —
      # саме на /[locale]/catalog/[slug]. Збірці потрібне лише НЕпорожнє
      # значення: initializeApp/getAuth не ходять у мережу, перевірка
      # ключа відбувається аж при реальному вході.
      #
      # Тому тут навмисно заглушки, а не справжні значення: у CI ніхто не
      # автентифікується, а зайвий раз вписувати робочу конфігурацію в
      # репозиторій немає причин. Справжні значення живуть у змінних
      # Vercel і в .env розробника.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-build-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generate the Prisma client before lint/typecheck — type-aware
      # ESLint rules (@typescript-eslint/no-unsafe-*) see PrismaClient
      # methods as unresolved `any` without it. Must run from apps/api:
      # prisma.config.ts (which supplies datasource.url) is only
      # auto-discovered from its own directory, not via --schema from
      # the repo root — see docs/adr/0004-prisma7-driver-adapter.md.
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run build
      - run: npm run test
