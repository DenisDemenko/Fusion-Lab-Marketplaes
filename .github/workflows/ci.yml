name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fusionlab
          POSTGRES_PASSWORD: fusionlab
          POSTGRES_DB: fusionlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fusionlab:fusionlab@localhost:5432/fusionlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generate the Prisma client before lint/typecheck — type-aware
      # ESLint rules (@typescript-eslint/no-unsafe-*) see PrismaClient
      # methods as unresolved `any` without it.
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run build
      - run: npm run test
